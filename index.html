<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTO Request Portal</title>
    <meta
      name="description"
      content="Simple project request form with project selection, elevation style, and project stage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <span class="eyebrow">Project control</span>
            <h1>QTO</h1>
          </div>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Request intake</p>
            <h2>New project request</h2>
          </div>
        </header>

        <section class="panel">
          <form id="request-form" class="request-form">
            <label>
              Project
              <select id="project-select" required>
                <option value="">Select a project</option>
              </select>
            </label>

            <label>
              Elevation style
              <select id="elevation-select" required>
                <option value="">Select an elevation style</option>
              </select>
            </label>

            <label>
              Project stage
              <select id="project-stage" required>
                <option value="">Select a stage</option>
              </select>
            </label>

            <button type="submit" class="primary-button">Submit request</button>
          </form>

          <div id="form-message" class="message hidden" aria-live="polite"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Recent requests</h3>
          </div>
          <ul id="request-list" class="request-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
