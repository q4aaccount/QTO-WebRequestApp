<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTO Request Portal</title>
    <meta
      name="description"
      content="Simple project request form with project selection, elevation style, and project stage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand" aria-label="Q4A brand">
          <div class="brand-mark" aria-label="Q4A logo">
            <span class="q-loop">Q</span>
            <span class="brand-4a">4A</span>
          </div>
        </div>
        <div class="brand-credit">Powered by Q4Automation</div>
        <nav class="tab-nav" aria-label="Main sections">
          <button type="button" class="tab-button is-active" data-tab="home" aria-selected="true">Home</button>
          <button type="button" class="tab-button" data-tab="history" aria-selected="false">Request History</button>
        </nav>

        <div class="page-shortcuts" aria-label="Page shortcuts">
          <p class="shortcut-label">Quick links</p>
          <a class="shortcut-link" href="https://www.linkedin.com/company/q4-architects-inc-" target="_blank" rel="noreferrer noopener" aria-label="Visit LinkedIn">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/linkedin.svg" alt="LinkedIn" />
          </a>
          <a class="shortcut-link" href="https://www.q4architects.com/" target="_blank" rel="noreferrer noopener" aria-label="Visit website">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/googlechrome.svg" alt="Website" />
          </a>
          <a class="shortcut-link" href="https://www.instagram.com/q4architects" target="_blank" rel="noreferrer noopener" aria-label="Visit Instagram">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/instagram.svg" alt="Instagram" />
          </a>
        </div>
		<div id="user-account" class="sidebar-account hidden">
  
  <div class="sidebar-user-details">
    <div id="account-avatar" class="account-avatar">
      U
    </div>

    <div class="account-text">
      <span class="account-label">Signed in as</span>
      <strong id="account-name">User</strong>
      <span id="account-email"></span>
    </div>
  </div>

  <button type="button" id="sign-out-btn"class="sidebar-sign-out" > Log out</button>
</div>

      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Request intake</p>
            <h2>Submit Your Request</h2>
          </div>
        </header>

        <div class="tab-panels">
          <section class="tab-panel is-active" data-panel="home">
            <div class="home-layout">
              <section class="workspace">
                <section id="auth-panel" class="panel auth-panel">
                  <div class="auth-header">
                    <p class="eyebrow eyebrow-dark">Welcome</p>
                    <h3 id="auth-title">Sign in to continue</h3>
                  </div>

                  <form id="auth-form" class="auth-form">
                    <label>
                      Email
                      <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                    </label>

                    <label>
                      Password
                      <input id="auth-password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required />
                    </label>

                    <button type="submit" id="auth-submit" class="primary-button">Sign in</button>
                    <button type="button" id="auth-toggle" class="text-button">Create account</button>
                  </form>

                  <div id="auth-message" class="message hidden" aria-live="polite"></div>
                </section>

                <section id="request-panel" class="panel request-panel hidden">
                  <form id="request-form" class="request-form">
                    <label>
                      Project
                      <select id="project-select" required>
                        <option value="">Select a project</option>
                      </select>
                    </label>

                    <label>
                      Elevation style
                      <select id="elevation-select" required>
                        <option value="">Select an elevation style</option>
                      </select>
                    </label>

                    <label>
                      Exterior / Interior
                      <select id="scope-select" required>
                        <option value="">Select an option</option>
                        <option value="Interior">Interior</option>
                        <option value="Exterior">Exterior</option>
                        <option value="Both">Both</option>
                      </select>
                    </label>

                    <div id="interior-options-wrapper" class="hidden">
                      <label>
                        Interior options
                        <select id="interior-options">
                          <option value="">Select an interior option</option>
                          <option value="Cabinets">Cabinets</option>
                          <option value="Countertops">Countertops</option>
                          <option value="Flooring">Flooring</option>
                          <option value="Paint">Paint</option>
                          <option value="Trim">Trim</option>
                          <option value="Lighting">Lighting</option>
                        </select>
                      </label>
                    </div>

                    <button type="submit" class="primary-button">Submit Your Request</button>
                  </form>

                  <div id="form-message" class="message hidden" aria-live="polite"></div>
                </section>

                <aside class="gallery-panel" aria-label="Project reference images">
                  <div class="gallery-header">
                    <p class="eyebrow eyebrow-dark">Reference</p>
                    <h3 id="gallery-title">Elevation concepts</h3>
                  </div>

                  <div class="slideshow" data-slideshow>
                    <figure class="slide is-active" data-title="Front elevation reference">
                      <img
                        src="https://github.com/user-attachments/assets/256fce42-37a9-42c0-af97-36bbe810c4dd"
                        alt="Reference image 1"
                      />
                    </figure>
                    <figure class="slide" data-title="Material overlap details">
                      <img
                        src="https://github.com/user-attachments/assets/4f74e958-7b6a-4c76-8b6a-b0277dc1d6de"
                        alt="Reference image 2"
                      />
                    </figure>
                    <figure class="slide" data-title="Elevation section focus">
                      <img
                        src="https://github.com/user-attachments/assets/ec5278fe-5aab-4730-a0c4-592795918b4c"
                        alt="Reference image 3"
                      />
                    </figure>
                    <figure class="slide" data-title="Garage and façade alignment">
                      <img
                        src="https://github.com/user-attachments/assets/db865273-19b3-4d22-b370-a2e62c64d024"
                        alt="Reference image 4"
                      />
                    </figure>
                    <figure class="slide" data-title="Overlapping materials in elevation view">
                      <img
                        src="https://github.com/user-attachments/assets/cd3e6555-3ae2-43b1-85be-164e993dddb3"
                        alt="Reference image 5"
                      />
                    </figure>
                    <div class="slide-indicators" aria-label="Slideshow navigation">
                      <button type="button" class="slide-dot is-active" data-slide-to="0" aria-label="Show image 1"></button>
                      <button type="button" class="slide-dot" data-slide-to="1" aria-label="Show image 2"></button>
                      <button type="button" class="slide-dot" data-slide-to="2" aria-label="Show image 3"></button>
                      <button type="button" class="slide-dot" data-slide-to="3" aria-label="Show image 4"></button>
                      <button type="button" class="slide-dot" data-slide-to="4" aria-label="Show image 5"></button>
                    </div>
                  </div>
                </aside>
              </section>
            </div>
          </section>

          <section class="tab-panel" data-panel="history">
            <div class="panel history-panel">
              <div class="panel-header">
                <h3>Request history</h3>
              </div>
              <ul id="history-request-list" class="request-list" aria-live="polite"></ul>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="./firebase-config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
